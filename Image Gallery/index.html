
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMI | Image Gallery</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <div class="logo">LU<span>MI</span>.</div>
    <div class="header-tag">A CURATED VISUAL JOURNAL</div>
  </header>

  <section class="hero">
    <div class="eyebrow">✦ The art of seeing</div>
    <h1>Moments worth<br>looking at <em>twice.</em></h1>
    <p>
      A collection of beautiful places, quiet details,
      and unforgettable moments captured through a lens.
    </p>
  </section>

  <main class="gallery-section">
    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All photos</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="architecture">Architecture</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
        <button class="filter-btn" data-filter="abstract">Abstract</button>
      </div>
      <div class="count" id="count">12 photographs</div>
    </div>

    <div class="gallery" id="gallery"></div>
    <div class="empty" id="empty">No photos in this category yet.</div>
  </main>

  <footer>
    <span>© 2026 LUMI GALLERY</span>
    <span>MADE WITH CREATIVITY ✦</span>
  </footer>

  <div class="lightbox" id="lightbox"
       role="dialog" aria-modal="true" aria-label="Image viewer">

    <button class="lb-btn close-btn" id="close" aria-label="Close">×</button>
    <button class="lb-btn prev-btn" id="prev" aria-label="Previous image">‹</button>

    <div class="lightbox-content">
      <img id="largeImage" src="" alt="">
      <h2 id="largeTitle"></h2>
      <p id="largeCategory"></p>
    </div>

    <button class="lb-btn next-btn" id="next" aria-label="Next image">›</button>
  </div>

</body>
</html>
