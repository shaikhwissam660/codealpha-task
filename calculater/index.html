<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="history" id="history"></div>
    <div class="display" id="display">0</div>

    <div class="buttons">
      <button class="fn clear" onclick="clearAll()">C</button>
      <button class="fn" onclick="deleteLast()" aria-label="Delete">&#9003;</button>
      <button class="fn" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('/')" aria-label="Divide">&divide;</button>

      <button onclick="addNumber('7')">7</button>
      <button onclick="addNumber('8')">8</button>
      <button onclick="addNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')" aria-label="Multiply">&times;</button>

      <button onclick="addNumber('4')">4</button>
      <button onclick="addNumber('5')">5</button>
      <button onclick="addNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')" aria-label="Subtract">&minus;</button>

      <button onclick="addNumber('1')">1</button>
      <button onclick="addNumber('2')">2</button>
      <button onclick="addNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')" aria-label="Add">+</button>

      <button class="zero" onclick="addNumber('0')">0</button>
      <button onclick="addNumber('.')">.</button>
      <button class="equals" onclick="calculate()" aria-label="Equals">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
